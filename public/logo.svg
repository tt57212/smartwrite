  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4"/>

  <!-- Schreiblinien -->
  <g stroke="rgba(255,255,255,0.35)" stroke-width="10" stroke-linecap="round">
    <line x1="120" y1="380" x2="392" y2="380"/>
    <line x1="120" y1="416" x2="300" y2="416"/>
  </g>

  <!-- Bleistift -->
